name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # versão vem de "packageManager" no package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rls:
    name: Isolamento entre tenants (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só liga quando o projeto Supabase existir (T3). Antes disso o job passa sem fazer nada.
    steps:
      - uses: actions/checkout@v7
      - id: has_supabase
        run: |
          if [ -f supabase/config.toml ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has_supabase.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.has_supabase.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.has_supabase.outputs.enabled == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - if: steps.has_supabase.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has_supabase.outputs.enabled == 'true'
        run: supabase start
      - if: steps.has_supabase.outputs.enabled == 'true'
        run: supabase db reset
      # CI=true faz db:seed e test:rls aceitarem o Supabase local (ADR-008, ADR-010).
      - if: steps.has_supabase.outputs.enabled == 'true'
        run: pnpm run --if-present db:seed
      - if: steps.has_supabase.outputs.enabled == 'true'
        run: pnpm run --if-present test:rls
