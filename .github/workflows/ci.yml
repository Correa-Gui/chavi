name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # versão vem de "packageManager" no package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rls:
    name: Isolamento entre tenants (Supabase local)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Falha o job se o Supabase local não subir ou se alguma migration quebrar.
      - run: supabase start
      # Critério 0.2: o banco é recriado do zero a partir das migrations + seed.sql.
      - run: supabase db reset
      # Chaves do Supabase local (descartáveis, geradas no runner) para seed e testes.
      - name: Exporta variáveis do Supabase local
        run: |
          eval "$(supabase status -o env)"
          for v in API_URL PUBLISHABLE_KEY SECRET_KEY; do
            if [ -z "${!v}" ]; then echo "::error::supabase status não retornou $v"; exit 1; fi
          done
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "SEED_USER_PASSWORD=ci-senha-local-descartavel"
          } >> "$GITHUB_ENV"
      # CI=true (definido pelo GitHub) faz db:seed e test:rls aceitarem o Supabase local.
      - run: pnpm db:seed
      - run: pnpm test:rls
